[project]
name = "milemarker-api"
version = "0.1.0"
description = "Plans the cheapest fuel stops along a driving route in the USA"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "psycopg[binary]>=3.3.9",
    "redis>=8.1.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
# No test may reach beyond this machine. pytest-socket fails any test that opens a
# connection to anything but localhost. (The PostgreSQL driver connects outside Python's
# socket module, so the local database is unaffected.)
addopts = "-ra --disable-socket --allow-hosts=127.0.0.1,::1 -m 'not slow'"
markers = [
    "slow: the full-size exactness checks; run them with: uv run pytest -m slow",
]

[tool.coverage.run]
# Branches as well as lines: a line that runs is not proof that both ways through it do.
branch = true
source = ["config", "stations", "trips"]
omit = ["*/migrations/*"]

[tool.coverage.report]
# The floor: the figure measured when it was set (98.4%), rounded down. A change that
# lowers coverage below it fails the run.
fail_under = 98
show_missing = true
skip_covered = true

[tool.mypy]
# The modules that hold the rules and import nothing from Django. The Django layer is left
# out: its type stubs do not yet declare support for Django 6.1.
files = [
    "stations/sphere.py",
    "stations/types.py",
    "trips/services/fuel.py",
    "trips/services/geo.py",
    "trips/services/corridor.py",
    "trips/services/answer.py",
]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# numpy ships its own types; scipy does not.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds records and research scripts; they are not part of the application.
extend-exclude = ["**/migrations/*.py", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
