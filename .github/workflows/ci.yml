name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The same image as docker-compose.yml, by digest.
        image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
        # Same user, password and database as docker-compose.yml: the default DATABASE_URL.
        env:
          POSTGRES_USER: milemarker
          POSTGRES_PASSWORD: milemarker
          POSTGRES_DB: milemarker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U milemarker -d milemarker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # For the Redis tests, which use its database 15 at the default REDIS_TEST_URL. The
      # suite never sets REDIS_URL: every other test runs on the in-memory cache.
      redis:
        image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://milemarker:milemarker@127.0.0.1:5432/milemarker
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact version tags only after v7, with no moving major tag.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      # --locked fails if uv.lock no longer matches pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python manage.py makemigrations --check --dry-run
      # A warning fails it too; each silenced check has its reason in config/settings.py.
      - name: Deployment check
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: Tests with coverage
        run: uv run pytest --cov
      - name: Coverage in the job summary
        if: always()
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: Slow exactness test
        run: uv run pytest -m slow
      - run: uv run pip-audit

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Running image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v7
      - name: Start the end-to-end stack
        run: $COMPOSE up --build -d
      - name: Wait for the API
        # The setup service loads the stations first, so allow a few minutes. The health
        # address answers 200 once this worker has its stations, and 503 before.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/; then exit 0; fi
            sleep 5
          done
          echo "The API did not answer in time" >&2
          exit 1
      - name: Postman collection
        run: npx --yes newman@6.2.3 run docs/postman/milemarker.postman_collection.json --env-var base_url=http://127.0.0.1:8000 --timeout-request 60000
      - name: Eight routing requests, each matched to a recording
        run: |
          curl -fsS http://127.0.0.1:5000/_requests | tee requests.json
          python3 - <<'PY'
          import json
          log = json.load(open("requests.json"))
          unmatched = [r for r in log["requests"] if r["matched"] is None]
          if not log["requests"]:
              raise SystemExit("The stand-in served no routing request")
          if unmatched:
              raise SystemExit(f"{len(unmatched)} request(s) matched no recording: {unmatched}")
          # The collection's sixteen requests are eight distinct trips; the rest are
          # answered from the cache or refused before routing.
          if log["count"] != 8:
              raise SystemExit(f"{log['count']} routing requests, expected 8")
          print(f"{log['count']} routing requests, all matched")
          PY
      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
