# One pull request a week for each ecosystem: every update in it is grouped together.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
    # The Python line is chosen, not drifted into: .python-version and uv.lock name 3.12.
    # Patch releases and new digests still arrive.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The images named in the Compose files, which the docker entry above does not read.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
    # PostgreSQL 17 is a decision (requirements, NFR-10); a new major version changes where
    # the data lives and is taken on purpose, not by a weekly update.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
