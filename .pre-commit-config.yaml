# Install once with: uvx pre-commit install
# Run over everything with: uvx pre-commit run --all-files
#
# data/ and *.gz are kept byte for byte as received, so no hook touches them.
exclude: '^data/|\.gz$'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # The version locked in uv.lock.
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
